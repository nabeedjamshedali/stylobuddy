# F22_A03 / task-9 brief Q6: the Firestore rules suite under
# test/firestore_rules_test/ needs a live Firestore emulator
# (FIRESTORE_EMULATOR_HOST) and must never run as part of the default
# `flutter test` command. Every file in that directory carries the
# `firestore-rules` tag (`@Tags(['firestore-rules'])`); `skip` here makes
# the default run skip them rather than fail outright when the emulator
# isn't up. To actually run the suite, use the one documented script,
# which bundles the two load-bearing flags so they can't be dropped
# independently (a dart_test.yaml `presets:` block was tried first, but
# `flutter test` — unlike bare `dart test` — has no `--preset`/`-P` flag
# to read it with, so a script is the equivalent that actually works with
# this project's tooling):
#
#   ./scripts/run_firestore_rules_suite.sh
#
# See that script for what `--run-skipped` and `--concurrency=1` are each
# for and why both are required together.
tags:
  firestore-rules:
    skip: >-
      Requires the Firestore emulator (FIRESTORE_EMULATOR_HOST). Run via
      `./scripts/run_firestore_rules_suite.sh`.
